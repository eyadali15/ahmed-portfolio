<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d060"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a67c00"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <g transform="translate(4,6)" fill="url(#g)">
    <!-- Camera body -->
    <rect x="1" y="6" width="16" height="12" rx="2"/>
    <!-- Lens -->
    <circle cx="9" cy="12" r="3.5" fill="#0a0a0a" stroke="url(#g)" stroke-width="1.2"/>
    <circle cx="9" cy="12" r="1.5" fill="url(#g)" opacity="0.6"/>
    <!-- Film reel -->
    <circle cx="5" cy="3" r="2.5" fill="none" stroke="url(#g)" stroke-width="1.2"/>
    <circle cx="13" cy="3" r="2.5" fill="none" stroke="url(#g)" stroke-width="1.2"/>
    <circle cx="5" cy="3" r="0.8"/>
    <circle cx="13" cy="3" r="0.8"/>
    <!-- Viewfinder -->
    <polygon points="18,8 24,5 24,15 18,12"/>
  </g>
</svg>